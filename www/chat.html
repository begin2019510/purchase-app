<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="app-version" content="3.1.21">
<title>Claude · 个人管家</title>
<meta name="theme-color" content="#f5f6fa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Claude">
<link rel="apple-touch-icon" href="icon-180.png" sizes="180x180">
<link rel="icon" href="icon-192.png" sizes="192x192">
<script>
(function(){
  try{
    var d=localStorage.getItem('dark_mode');
    if(d==='1'){ document.documentElement.classList.add('dark'); document.documentElement.setAttribute('data-theme','dark'); }
    else if(d==='0'){ document.documentElement.classList.add('light'); document.documentElement.setAttribute('data-theme','light'); }
  }catch(e){}
})();
</script>
<style>html{background:#f5f6fa}html[data-theme="dark"],body.dark{background:#111216}@media(prefers-color-scheme:dark){html:not(.light):not([data-theme="light"]){background:#111216}}</style>
<link rel="stylesheet" href="theme.css?v=3.1.21">
<link rel="stylesheet" href="ui-refresh.css?v=3.1.21">
<link rel="stylesheet" href="chat.css?v=3.1.21">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
</head>
<body class="chat-page">

<div class="cc-app" id="ccApp">
  <div class="cc-scrim" id="ccScrim" onclick="ccCloseSidebar()"></div>

  <aside class="cc-sidebar" id="ccSidebar" aria-label="会话列表">
    <div class="cc-brand">
      <div class="cc-brand-mark">✳</div>
      <div class="cc-brand-text">
        <div class="cc-brand-name">Claude</div>
        <div class="cc-brand-sub">个人管家 · CloudCLI</div>
      </div>
    </div>
    <button class="cc-new-btn" onclick="ccNewSession()">
      <span>＋</span> 新对话
    </button>
    <div class="cc-side-head">
      <span>最近会话</span>
      <button class="cc-mini-btn" onclick="ccRefreshSessions(true)" title="刷新会话" aria-label="刷新会话">↻</button>
    </div>
    <div class="cc-session-list" id="ccSessionList"></div>
    <div class="cc-side-foot">
      <div class="cc-side-note">与 agent 网页版会话互通，可继续电脑上的对话。</div>
      <div class="cc-side-account">
        <span class="cc-side-user"><span class="cc-dot"></span><span id="ccSideUser">admin</span></span>
        <a class="cc-side-link" href="/">← 返回 App</a>
      </div>
    </div>
  </aside>

  <main class="cc-main">
    <header class="cc-header">
      <button class="cc-icon-btn cc-mobile-only" onclick="ccGoBack()" aria-label="返回">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="cc-icon-btn cc-mobile-only" onclick="ccOpenSidebar()" aria-label="会话列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="cc-title-wrap">
        <div class="cc-title" id="ccTitle">Claude</div>
        <div class="cc-subtitle" id="ccSubtitle"><span class="cc-dot online"></span>CloudCLI 通道</div>
      </div>
      <div class="cc-header-actions">
        <button class="cc-icon-btn cc-desktop-only" onclick="ccRefreshSessions(true)" title="刷新会话" aria-label="刷新会话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="cc-icon-btn" onclick="ccNewSession()" title="新对话" aria-label="新对话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div class="cc-thread-wrap">
      <div class="cc-thread" id="ccThread">
        <div class="cc-thread-inner" id="ccThreadInner"></div>
      </div>
      <button class="cc-jump" id="ccJump" onclick="ccScrollBottom(true)" aria-label="回到底部">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="cc-bottom">
      <div class="cc-activity" id="ccActivity" aria-live="polite"></div>
      <form class="cc-composer" id="ccComposer" onsubmit="return false">
        <textarea id="ccInput" rows="1" placeholder="给 Claude 发消息…" maxlength="20000" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" aria-label="消息"></textarea>
        <div class="cc-composer-foot">
          <div class="cc-hint">Enter 发送 · Shift+Enter 换行</div>
          <button class="cc-send" id="ccSend" type="button" onclick="ccPrimaryAction()" aria-label="发送">
            <svg class="cc-send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            <svg class="cc-stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </div>
      </form>
      <div class="cc-disclaimer">Claude 可能会出错，执行命令或修改文件前请确认。</div>
    </div>
  </main>
</div>

<div class="cc-gate" id="ccGate">
  <div class="cc-gate-card">
    <div class="cc-gate-icon" id="ccGateIcon">🔒</div>
    <div class="cc-gate-title" id="ccGateTitle">仅管理员可用</div>
    <div class="cc-gate-text" id="ccGateText">请回到 App，用管理员账号登录后再打开。</div>
    <div class="cc-gate-actions">
      <a class="cc-btn" href="/">返回 App</a>
      <button class="cc-btn ghost" id="ccGateRetry" onclick="location.reload()">重新加载</button>
    </div>
  </div>
</div>

<div class="cc-dialog-overlay" id="ccDialogOverlay">
  <div class="cc-dialog" role="dialog" aria-modal="true" aria-labelledby="ccDialogTitle">
    <div class="cc-dialog-title" id="ccDialogTitle"></div>
    <div class="cc-dialog-text" id="ccDialogText"></div>
    <input class="cc-dialog-input" id="ccDialogInput" maxlength="200" autocomplete="off">
    <div class="cc-dialog-actions">
      <button class="cc-btn ghost" id="ccDialogCancel">取消</button>
      <button class="cc-btn danger" id="ccDialogOk">确定</button>
    </div>
  </div>
</div>

<div class="cc-ask-overlay" id="ccAskOverlay">
  <div class="cc-ask-modal" role="dialog" aria-modal="true" aria-labelledby="ccAskHead">
    <div class="cc-ask-head" id="ccAskHead">❓ Claude 想问你</div>
    <div class="cc-ask-card" id="ccAskCard"></div>
  </div>
</div>

<div class="cc-toast" id="ccToast" role="status"></div>

<script src="js/chat.js?v=3.1.21"></script>
</body>
</html>
